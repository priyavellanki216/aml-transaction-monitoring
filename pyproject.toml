[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-transaction-monitoring-workbench"
version = "0.1.0"
description = "Synthetic-data AML transaction monitoring and investigation workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<4.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aml_workbench = ["sql/*.sql"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
